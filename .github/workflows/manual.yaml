name: manual
on: workflow_dispatch
jobs:
  jobA:
    runs-on: ubuntu-latest
    steps:
      - name: manual
        run: |
          if [[ 1 -eq 1 ]];then
            IFS='.' read -r release_major release_minor <<< "3.0"
            if [[ ${{vars.major}} -gt release_major ]]; then
              echo "inside if"
            elif [[ $release_major -eq $release_minor ]];then
              echo "equals"
            else
              echo "inside else"
            fi
          fi
