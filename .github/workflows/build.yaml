name: build
on:
  pull_request:
    types: closed

jobs:
  build_main:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
        ref: main
        
    - name: list_tags
      run: |
        git fetch --tags
        latest_tag=$(git describe --tags --abbrev=0)
        echo "Latest tag: $latest_tag"
  build_release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
        ref: release
        
    - name: list_tags
      run: |
        git fetch --tags
        latest_tag=$(git describe --tags --abbrev=0)
        echo "Latest tag: $latest_tag"   
        
        
        
      
    
    
