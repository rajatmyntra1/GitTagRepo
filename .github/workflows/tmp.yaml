name: tmp
on: push
jobs:

  paramters:
    runs-on: ubuntu-latest
    steps:
      - name: param
        run: |
          echo "n=rajatenv" >> $GITHUB_ENV
          echo "l=bhawsarenv" >> $GITHUB_ENV
      - name: useparam
        run: |
          echo $n,$l
  tmp:
    runs-on: ubuntu-latest
    steps:
      - name: tmp_step
        run: |
          echo ${{vars.MAJOR_RELEASE_VERSION }}
  tmp_env:
    runs-on: ubuntu-latest
    env:
      name: rajat
      lastname: bhawsar
    steps:
      - name: env_tmp_task
        run: |
          echo $name,$lastname
          echo ${{env.name }} ${{env.lastname}}

      
